aid: tessera-therapeutics
name: Tessera Therapeutics
description: 'Tessera Therapeutics is an early-stage life sciences company, founded and backed by
  Flagship Pioneering, pioneering Gene Writing — a new category of genetic medicine designed to write
  therapeutic messages into the genome to treat and potentially cure disease at its source. Its Gene
  Writing platform uses mobile genetic elements delivered via lipid nanoparticles to insert genes and
  exons, make small insertions and deletions, or change single or multiple DNA base pairs, with
  applications spanning sickle cell disease, in vivo CAR-T, HIV, and other monogenic, metabolic,
  autoimmune, and neurodegenerative diseases. This API Evangelist profile tracks the company as a
  health-tech portfolio lead; Tessera is a therapeutics developer and does not currently publish a
  public developer or API surface.'
